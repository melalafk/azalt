<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Azalt!</title>
<style>
:root{
  --bg:#0f0b16; --line:rgba(255,255,255,.09);
  --tx:#f2eff9; --mut:#a094bd; --dim:#726a8a;
  --grad:linear-gradient(135deg,#a855f7,#f472b6);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;}
body{
  background:
    radial-gradient(900px 520px at -12% -12%, rgba(168,85,247,.17), transparent 62%),
    radial-gradient(820px 500px at 112% 10%, rgba(244,114,182,.13), transparent 60%),
    var(--bg);
  min-height:100dvh; max-width:480px; margin:0 auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
header{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.logo{width:38px; height:38px; border-radius:12px; background:var(--grad);
  display:flex; align-items:center; justify-content:center; font-size:19px;
  box-shadow:0 6px 18px rgba(168,85,247,.35); flex:none;}
h1{font-size:19px; font-weight:800; letter-spacing:.2px; line-height:1.1;}
h1 em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sub{font-size:11px; color:var(--mut); font-weight:600; margin-top:1px;}
main{flex:1; display:flex; flex-direction:column; justify-content:center;}
.card{background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border:1px solid var(--line); border-radius:22px;
  box-shadow:0 12px 34px rgba(0,0,0,.35); padding:16px; text-align:center;}
.card img{display:block; width:100%; aspect-ratio:1/1; object-fit:cover; object-position:50% 35%;
  border-radius:16px; border:1px solid var(--line);}
.tag{display:inline-block; margin:18px 0 10px; padding:6px 12px; border-radius:999px;
  background:var(--grad); color:#fff; font-size:10.5px; font-weight:800; letter-spacing:1.6px;
  text-transform:uppercase; box-shadow:0 4px 12px rgba(168,85,247,.35);}
.msg{font-size:24px; font-weight:800; line-height:1.25; letter-spacing:.1px; text-wrap:balance; padding:0 4px 8px;}
.msg em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
</style>
</head>
<body>
<header>
  <div class="logo">💜</div>
  <div>
    <h1>Azalt<em>!</em></h1>
    <div class="sub">Batus &amp; Ulkus</div>
  </div>
</header>
<main>
  <div class="card">
    <img src="/kedi.jpg" alt="Camın ardından kızgın kızgın bakan kedi" width="735" height="817">
    <div class="tag">Kapalı</div>
    <p class="msg"><em>Batuhan</em> sigarayı bırakmadığı için uygulamamız kapatılmıştır.</p>
  </div>
</main>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
}
</script>
</body>
</html>
